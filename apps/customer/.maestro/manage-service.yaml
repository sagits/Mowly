appId: com.renatoprobst.mowly
---
- runFlow: common/launch.yaml
- tapOn:
    id: tab-services
- tapOn:
    id: booking-card-b-mowing
- tapOn:
    id: detail-skip
- tapOn:
    id: skip-confirm
# seed: next visit is today + 5 days; a monthly skip adds 30 more (same rule as the mocks), so the date moves with the clock
- evalScript: ${output.expected = (function () { var d = new Date(); d.setDate(d.getDate() + 35); return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getDay()] + ', ' + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][d.getMonth()] + ' ' + d.getDate() + ' (Monthly)'; })()}
- assertVisible: ${output.expected}
- tapOn:
    id: detail-cancel
- tapOn:
    id: cancel-confirm
- assertNotVisible:
    id: booking-card-b-mowing
