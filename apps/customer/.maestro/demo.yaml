appId: com.renatoprobst.mowly
---
# Customer half of the PRD demo: Browse -> VIEW PRICE -> quote -> book -> open the booking.
- runFlow: common/launch.yaml
- tapOn:
    id: browse-view-price-leaf-removal
- extendedWaitUntil:
    visible:
      id: quote-name
    timeout: 30000
- tapOn:
    id: quote-continue
- extendedWaitUntil:
    visible:
      id: plan-screen
    timeout: 30000
# plan-screen shows a skeleton first and CONTINUE stays disabled until the quote loads
- extendedWaitUntil:
    visible:
      id: 'plan-row-.*'
    timeout: 30000
- tapOn:
    id: quote-continue
- extendedWaitUntil:
    visible:
      id: account-screen
    timeout: 30000
- tapOn:
    id: account-first
- inputText: Renato
- tapOn:
    id: account-last
- inputText: Probst
- tapOn:
    id: account-email
- inputText: renato@example.com
- hideKeyboard
- scroll
- scroll
- tapOn:
    id: account-terms
- tapOn:
    id: book-now
- extendedWaitUntil:
    visible:
      id: booked-screen
    timeout: 30000
- tapOn:
    id: booked-go
- extendedWaitUntil:
    visible:
      id: screen-services
    timeout: 30000
- assertVisible: '.*Leaf Removal.*'
- tapOn:
    id: 'booking-card-.*'
- extendedWaitUntil:
    visible:
      id: service-detail
    timeout: 30000
