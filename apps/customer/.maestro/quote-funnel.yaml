appId: com.renatoprobst.mowly
---
- runFlow: common/launch.yaml
- openLink: mowly://quote
- runFlow:
    when:
      visible: 'Open in .*'
    commands:
      - tapOn: Open
- tapOn:
    id: service-tile-mowing
- tapOn:
    id: quote-continue
- assertVisible:
    id: quote-name
- tapOn:
    id: quote-continue
- extendedWaitUntil:
    visible:
      id: plan-screen
    timeout: 15000
- tapOn:
    id: plan-row-monthly
- scrollUntilVisible:
    element:
      id: plan-faq-link
- tapOn:
    id: plan-faq-link
- tapOn:
    id: faq-ok
- tapOn:
    id: quote-continue
- assertVisible:
    id: account-screen
- tapOn:
    id: account-first
- inputText: Renato
- tapOn:
    id: account-last
- inputText: Probst
- tapOn:
    id: account-email
- inputText: renato@example.com
- hideKeyboard
- scroll
- scroll
- tapOn:
    id: account-terms
- tapOn:
    id: book-now
- extendedWaitUntil:
    visible:
      id: booked-screen
    timeout: 15000
- tapOn:
    id: booked-go
- assertVisible:
    id: screen-services
- assertVisible: '.*Mowing.*'
