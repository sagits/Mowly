appId: com.renatoprobst.mowly
---
- runFlow: common/launch.yaml
- openLink: mowly://quote
- runFlow:
    when:
      visible: 'Open in .*'
    commands:
      - tapOn: Open
- tapOn:
    id: service-tile-mowing
- tapOn:
    id: quote-continue
- assertVisible:
    id: quote-name
- tapOn:
    id: quote-continue
- extendedWaitUntil:
    visible:
      id: plan-screen
    timeout: 15000
