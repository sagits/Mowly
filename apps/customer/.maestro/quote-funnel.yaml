appId: com.renatoprobst.mowly
---
- runFlow: common/launch.yaml
- openLink: mowly://quote
- runFlow:
    when:
      visible: 'Open in .*'
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: service-tile-mowing
    timeout: 30000
- tapOn:
    id: service-tile-mowing
- tapOn:
    id: quote-continue
- extendedWaitUntil:
    visible:
      id: quote-name
    timeout: 30000
- tapOn:
    id: quote-continue
- extendedWaitUntil:
    visible:
      id: plan-screen
    timeout: 30000
# plan-screen shows a skeleton first and CONTINUE stays disabled until the quote loads
- extendedWaitUntil:
    visible:
      id: 'plan-row-.*'
    timeout: 30000
- tapOn:
    id: plan-row-monthly
- scrollUntilVisible:
    element:
      id: plan-faq-link
- tapOn:
    id: plan-faq-link
- tapOn:
    id: faq-ok
- tapOn:
    id: quote-continue
- extendedWaitUntil:
    visible:
      id: account-screen
    timeout: 30000
- tapOn:
    id: account-first
- inputText: Renato
- tapOn:
    id: account-last
- inputText: Probst
- tapOn:
    id: account-email
- inputText: renato@example.com
- hideKeyboard
- scroll
- scroll
- tapOn:
    id: account-terms
- tapOn:
    id: book-now
- extendedWaitUntil:
    visible:
      id: booked-screen
    timeout: 30000
- tapOn:
    id: booked-go
- extendedWaitUntil:
    visible:
      id: screen-services
    timeout: 30000
- assertVisible: '.*Mowing.*'
