<title>Mowly Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: screen index on the left, a phone on the right; at phone width the index folds above a full-bleed app. */
:root {
  /* stage (follows the viewer's theme) */
  --stage: #EEF1EC; --stage-ink: #1E2A22; --stage-mut: #66756A; --stage-line: #D3DBD3; --stage-card: #FFFFFF; --stage-hi: #DDF3E5; --frame: #18201B;
  /* app (Mowly is light only, as in the PRD) */
  --primary: #18C058; --header: #08B460; --tint: #DCF4E8; --accent: #F48C04; --tile: #D8D8D8; --price: #A0A0A0;
  --callout: #E0E0E4; --page: #E8E8EC; --ink: #1A1A1A; --mut: #8A8A8A; --link: #3B6FD0; --line: #E2E2E2; --white: #FFFFFF;
  --orange: #E8780A; --blue: #2F6FE4; --danger: #E5484D; --scrim: rgba(0,0,0,.42); --lawn1: #5E9C4A; --lawn2: #3F7A35; --roof: #9A8F86;
  --f-app: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-disp: "Bricolage Grotesque", "Figtree", ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #121814; --stage-ink: #E6EEE8; --stage-mut: #93A398; --stage-line: #2A352D; --stage-card: #1A221D; --stage-hi: #1F3A29; --frame: #050806; color-scheme: dark } }
:root[data-theme="dark"] { --stage: #121814; --stage-ink: #E6EEE8; --stage-mut: #93A398; --stage-line: #2A352D; --stage-card: #1A221D; --stage-hi: #1F3A29; --frame: #050806; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--stage); color: var(--stage-ink); font-family: var(--f-app); }
.stage { display: grid; grid-template-columns: minmax(260px, 340px) auto; gap: 40px; justify-content: center; align-items: start;
  padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* index */
.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); max-height: calc(100vh - 40px); overflow: auto; min-width: 0; }
.index h1 { font-family: var(--f-disp); font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
.index p.lead { margin: 0 0 14px; color: var(--stage-mut); font-size: 13px; line-height: 1.45; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--stage-mut); margin-bottom: 16px; }
.legend b { color: var(--stage-ink); }
.group { margin-bottom: 14px; }
.group h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--stage-mut); margin: 0 0 6px; font-weight: 700; }
.group h3 { font-size: 12px; color: var(--stage-ink); margin: 10px 0 4px; font-weight: 700; }
.ix { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px; border-radius: 6px; color: var(--stage-ink); font: inherit; font-size: 13px; cursor: pointer; }
.ix:hover { background: var(--stage-line); }
.ix.on { background: var(--stage-hi); font-weight: 700; }
.ix code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--stage-mut); min-width: 62px; flex: none; }
.ix .inv { color: var(--orange); font-weight: 700; }
.mobile-index { display: none; }

/* device */
.device-col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.device { width: 390px; height: 800px; max-width: 100%; border-radius: 48px; background: var(--frame); padding: 12px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35); }
.screen-wrap { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: var(--white); color: var(--ink); font-family: var(--f-app); }
.statusbar { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-size: 14px; font-weight: 700; background: inherit; flex: none; }
.statusbar .dots { display: flex; gap: 5px; align-items: center; }
.statusbar .dots i { display: inline-block; width: 16px; height: 9px; border: 1.5px solid currentColor; border-radius: 3px; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--white); }
.screen.gray { background: var(--page); }
.body { flex: 1; overflow-y: auto; overflow-x: hidden; }
.pad { padding: 16px; }
.now { font-size: 13px; color: var(--stage-mut); text-align: center; }
.now b { color: var(--stage-ink); font-family: ui-monospace, Menlo, monospace; }
.caption { display: flex; gap: 8px; }
.chip-btn { border: 1px solid var(--stage-line); background: var(--stage-card); color: var(--stage-ink); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }

/* app primitives */
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 999px; padding: 13px 16px; font: inherit; font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--primary); color: var(--white); cursor: pointer; }
.btn.outline { background: var(--white); color: var(--primary); box-shadow: inset 0 0 0 1.5px var(--primary); }
.btn.orange { background: var(--accent); }
.btn:disabled, .btn.off { background: var(--callout); color: var(--mut); cursor: not-allowed; }
.btn:focus-visible, .ix:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.link { color: var(--link); text-decoration: underline; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; }
.glink { color: var(--primary); font-weight: 800; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; background: none; border: 0; cursor: pointer; padding: 8px; font-family: inherit; }
.title { font-size: 26px; font-weight: 700; line-height: 1.15; margin: 4px 0 6px; text-wrap: balance; }
.sub { color: #6B6B6B; font-size: 14px; line-height: 1.45; margin: 0 0 16px; }
.lbl { font-size: 12px; font-weight: 700; margin: 12px 0 5px; }
.inp { width: 100%; border: 1px solid #CFCFCF; border-radius: 4px; padding: 11px 12px; font: inherit; font-size: 14px; color: var(--ink); background: var(--white); box-sizing: border-box; }
.inp::placeholder { color: #B5B5B5; }
.inp.focus { border-color: var(--primary); }
.inp[disabled] { background: #F4F4F4; color: var(--mut); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.fine { font-size: 10.5px; color: #7A7A7A; line-height: 1.5; text-align: center; margin: 14px 0; }
.foot { flex: none; border-top: 1px solid var(--line); padding: 10px 16px 22px; background: var(--white); display: grid; gap: 8px; }
.cost { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; }
.fee { font-size: 11px; color: #6B6B6B; margin-top: -6px; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #D0D0D0; border-top-color: #777; animation: spin .8s linear infinite; }
.btn .spinner { width: 14px; height: 14px; border-color: #C9C9C9; border-top-color: #777; }
@keyframes spin { to { transform: rotate(360deg); } }
.center { display: flex; align-items: center; justify-content: center; }
.callout { border-radius: 6px; overflow: hidden; border: 1px solid var(--callout); margin: 16px 0; }
.callout .h { background: var(--callout); padding: 10px 12px; display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
.callout ul { margin: 0; padding: 10px 12px 12px 30px; font-size: 13px; line-height: 1.5; }
.list-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--white); width: 100%; border-left: 0; border-right: 0; border-top: 0; font: inherit; font-size: 14px; color: var(--ink); text-align: left; cursor: pointer; }
.list-row .grow { flex: 1; min-width: 0; }
.list-row .chev { color: var(--primary); }
.list-row.locked { color: #BDBDBD; cursor: default; }
.list-row.locked .chev { color: #D5D5D5; }
.badge { background: var(--primary); color: var(--white); font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
.pill { display: inline-block; background: var(--primary); color: var(--white); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.skel { background: linear-gradient(90deg, #EEE, #F6F6F6, #EEE); border-radius: 6px; }

/* customer */
.c-head { padding: 6px 16px 10px; border-bottom: 1px solid var(--line); }
.c-head .top { display: flex; justify-content: space-between; align-items: center; }
.wordmark { font-family: var(--f-disp); font-weight: 800; color: var(--primary); font-size: 26px; letter-spacing: -.03em; }
.c-head .addr { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; margin-top: 2px; }
.tile { width: 100%; border: 0; background: var(--tile); border-radius: 4px; padding: 13px; font: inherit; font-size: 13px; color: #333; position: relative; cursor: pointer; }
.tile.sel { background: var(--tint); box-shadow: inset 0 0 0 1.5px var(--primary); }
.tile .ck { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--primary); }
.tiles { display: grid; gap: 8px; }
.plan { display: flex; border-radius: 4px; overflow: hidden; background: var(--tile); cursor: pointer; border: 0; padding: 0; font: inherit; width: 100%; text-align: left; }
.plan .n { flex: 1; padding: 0 12px; display: flex; align-items: center; font-weight: 600; font-size: 15px; color: #333; }
.plan .p { width: 96px; background: var(--price); color: var(--white); text-align: right; padding: 7px 10px; }
.plan .p b { font-size: 21px; display: block; line-height: 1; }
.plan .p small { font-size: 9px; }
.plan.sel { background: var(--tint); box-shadow: inset 0 0 0 1.5px var(--primary); }
.plan.sel .p { background: var(--primary); }
.rec { display: inline-block; background: var(--primary); color: var(--white); font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 4px 4px 0 0; }
.aerial { width: 190px; height: 190px; border-radius: 50%; position: relative; background:
  repeating-linear-gradient(28deg, transparent 0 34px, rgba(200,200,190,.9) 34px 40px),
  radial-gradient(circle at 30% 35%, var(--roof) 0 16px, transparent 17px), radial-gradient(circle at 66% 30%, var(--roof) 0 14px, transparent 15px),
  radial-gradient(circle at 46% 70%, var(--roof) 0 18px, transparent 19px), radial-gradient(circle at 76% 66%, var(--roof) 0 13px, transparent 14px),
  linear-gradient(135deg, var(--lawn1), var(--lawn2)); }
.ring { position: absolute; inset: -14px; }
.ring circle { fill: none; stroke: var(--primary); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 690; stroke-dashoffset: 690; animation: draw 2.6s ease-in-out forwards; transform: rotate(-90deg); transform-origin: center; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.g-head { background: var(--header); color: var(--white); padding: 4px 16px 14px; flex: none; }
.g-head.statusbar { padding: 0 26px; }
.g-head .t { display: flex; justify-content: space-between; align-items: center; }
.g-head h1 { font-size: 24px; margin: 4px 0; font-weight: 700; }
.g-head .addr { display: flex; gap: 6px; align-items: center; font-size: 15px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); padding: 6px 0 20px; background: var(--white); }
.tabbar button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; font: inherit; font-size: 11px; color: var(--mut); cursor: pointer; }
.tabbar button.on { color: var(--header); font-weight: 700; }
.card { background: var(--white); border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.14); }
.promo { padding: 14px; display: grid; grid-template-columns: 1fr 86px; gap: 8px; align-items: center; }
.promo h4 { margin: 0 0 4px; font-size: 16px; }
.promo p { margin: 0 0 10px; font-size: 12px; color: #555; }
.sm-pill { border: 0; border-radius: 999px; background: var(--header); color: var(--white); font: inherit; font-weight: 800; font-size: 12px; padding: 6px 12px; cursor: pointer; }
.sm-pill.o { background: var(--white); color: var(--header); box-shadow: inset 0 0 0 1.5px var(--header); }
.explore { display: grid; grid-template-columns: 108px 1fr; overflow: hidden; }
.photo { min-height: 104px; background: radial-gradient(circle at 30% 40%, #7FB35F 0 22px, transparent 23px), radial-gradient(circle at 72% 30%, #6BA251 0 18px, transparent 19px), linear-gradient(160deg, #8CC06B, #3E7A33); }
.photo.leaf { background: radial-gradient(circle at 30% 60%, #D9952C 0 10px, transparent 11px), radial-gradient(circle at 60% 40%, #C47A22 0 8px, transparent 9px), radial-gradient(circle at 75% 75%, #E0A53A 0 9px, transparent 10px), linear-gradient(160deg, #A7B85A, #6C7A2E); }
.photo.pool { background: linear-gradient(160deg, #7FD3E8, #2A8FB3); }
.photo.bug { background: radial-gradient(circle at 50% 50%, #2D4D2A 0 6px, transparent 7px), linear-gradient(160deg, #A9CF8A, #4F8A3D); }
.svc-card { border-left: 4px solid var(--header); padding: 14px; display: grid; gap: 6px; font-size: 14px; cursor: pointer; }
.svc-card .r { display: flex; gap: 8px; align-items: center; color: #444; }
.act-row { display: flex; align-items: center; padding: 12px 16px; border: 0; background: none; width: 100%; text-align: left; font: inherit; cursor: pointer; }
.act-row b { display: block; font-size: 16px; }
.act-row span { color: #666; font-size: 13px; }
.thread { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--white); width: 100%; border-left: 0; border-right: 0; border-top: 0; text-align: left; font: inherit; }
.av { width: 42px; height: 42px; border-radius: 6px; background: var(--tint); color: var(--header); display: grid; place-items: center; font-weight: 800; flex: none; }
.bubble { max-width: 75%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.35; }
.bubble.me { background: var(--header); color: var(--white); margin-left: auto; border-bottom-right-radius: 4px; }
.bubble.them { background: #EFEFEF; border-bottom-left-radius: 4px; }

/* pro */
.p-bar { flex: none; display: grid; grid-template-columns: 70px 1fr 70px; align-items: center; padding: 6px 12px 12px; border-bottom: 1px solid var(--line); color: var(--primary); font-weight: 600; font-size: 16px; }
.p-bar .c { text-align: center; }
.p-bar button { background: none; border: 0; color: var(--primary); font: inherit; text-align: left; cursor: pointer; padding: 4px; }
.served { border: 1px solid #DADADA; border-radius: 4px; padding: 10px 12px; font-size: 12.5px; }
.sec { font-weight: 700; font-size: 13px; margin: 18px 0 4px; }
.cl { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #EFEFEF; font-size: 13px; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; font: inherit; color: var(--ink); cursor: pointer; text-align: left; }
.cl.done { color: var(--ink); }
.cl.done .st { color: var(--primary); }
.cl.locked { color: #C2C2C2; cursor: default; }
.cl .st { color: var(--primary); }
.cl.locked .st { color: #D0D0D0; }
.drawer { position: absolute; inset: 0; display: flex; z-index: 5; }
.drawer .panel { width: 78%; background: var(--white); padding-top: 44px; display: flex; flex-direction: column; }
.drawer .who { color: var(--primary); font-weight: 800; letter-spacing: .04em; padding: 6px 20px 14px; font-size: 13px; }
.drawer .mi { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: none; border: 0; font: inherit; font-size: 14px; color: #8E8E8E; cursor: pointer; text-align: left; }
.drawer .mi.on { color: var(--ink); }
.drawer .mi.on svg { color: var(--primary); }
.drawer .mi .badge { margin-left: auto; }
.drawer .scrim { flex: 1; background: var(--scrim); border: 0; cursor: pointer; }
.illus { width: 140px; height: 120px; margin: 0 auto; border-radius: 16px; display: grid; place-items: center; background: var(--tint); color: var(--header); }
.illus svg { width: 64px; height: 64px; stroke-width: 1.5; }
.dots3 { display: flex; gap: 8px; justify-content: center; margin: 18px 0; }
.dots3 i { width: 8px; height: 8px; border-radius: 50%; background: #DADADA; }
.dots3 i.on { background: var(--primary); }
.photo-btn { width: 64px; height: 64px; border-radius: 50%; background: #D8D8D8; display: grid; place-items: center; color: var(--white); border: 0; cursor: pointer; }
.daystrip { display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid var(--line); }
.daystrip button { border: 0; background: var(--white); padding: 6px 0; font: inherit; font-size: 11px; color: #555; cursor: pointer; border-right: 1px solid #F0F0F0; }
.daystrip button.on { background: var(--primary); color: var(--white); font-weight: 800; }
.map { position: relative; height: 210px; overflow: hidden; background:
  linear-gradient(90deg, transparent 0 48%, #F2F0E8 48% 50%, transparent 50%), linear-gradient(0deg, transparent 0 62%, #F2F0E8 62% 64%, transparent 64%),
  linear-gradient(35deg, transparent 0 40%, #F5E9C8 40% 41.5%, transparent 41.5%), repeating-linear-gradient(0deg, #E4EBDD 0 26px, #DCE5D3 26px 27px), #E4EBDD; }
.map.sat { background: linear-gradient(35deg, transparent 0 40%, #E2D7B5 40% 41.5%, transparent 41.5%), radial-gradient(circle at 30% 60%, #6E7F55 0 40px, transparent 41px), repeating-linear-gradient(90deg, #7E8C67 0 22px, #87946F 22px 24px), #7E8C67; }
.pinp { position: absolute; transform: translate(-50%, -100%); background: var(--white); border: 1.5px solid var(--primary); color: var(--ink); font-size: 11px; font-weight: 700; border-radius: 10px; padding: 3px 7px; cursor: pointer; font-family: inherit; }
.pinp.on { background: var(--primary); color: var(--white); }
.pager { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; color: var(--primary); }
.pager b { color: var(--ink); font-weight: 600; }
.job { padding: 0 16px 16px; font-size: 13px; }
.jd { border: 1px solid #E5E5E5; border-radius: 6px; padding: 10px 12px; margin-top: 8px; display: grid; gap: 5px; cursor: pointer; width: 100%; background: var(--white); font: inherit; text-align: left; }
.jd .top { display: flex; justify-content: space-between; color: var(--primary); font-weight: 700; font-size: 14px; }
.jd .dt { color: var(--orange); font-weight: 700; }
.cal { padding: 10px 14px; }
.cal h4 { text-align: center; font-weight: 500; margin: 8px 0; }
.cal .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
.cal .wd { font-size: 9px; color: #777; }
.day { border: 0; background: none; cursor: pointer; padding: 0; font: inherit; }
.day .n { display: block; background: #8E8E8E; color: var(--white); font-size: 9px; border-radius: 2px; padding: 1px 0; }
.day .c { display: block; border: 1px solid #E2E2E2; height: 20px; color: var(--blue); font-size: 13px; }
.day.today .c { border: 2px solid var(--primary); }
.rtile { border: 1px solid #DDD; background: var(--white); padding: 16px 6px; font: inherit; font-size: 13px; color: #444; cursor: pointer; border-radius: 2px; }
.rtile.sel { border-color: var(--primary); color: var(--primary); }
.stop { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #EFEFEF; font-size: 12.5px; }
.stop b { display: block; }
.num { width: 22px; height: 22px; border-radius: 50%; background: #444; color: var(--white); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.banner { margin: 12px 16px; background: var(--tint); color: var(--header); font-weight: 700; font-size: 13px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; }
.sup { margin: 8px; border: 1px solid #E3E3E3; border-radius: 4px; font-size: 12.5px; }
.sup .h { font-weight: 700; padding: 10px 10px 4px; }
.sup p { margin: 0; padding: 0 10px 10px; color: #444; line-height: 1.45; }
.sup button { width: 100%; border: 0; border-top: 1px solid #E3E3E3; background: var(--white); padding: 10px; font: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer; }
.ver { text-align: center; font-size: 10px; color: #555; font-weight: 600; margin: 18px 0 8px; }
.balance { background: var(--white); margin: 12px; border-radius: 4px; padding: 14px; }
.balance small { letter-spacing: .1em; font-size: 10px; font-weight: 700; color: #555; }
.balance b { display: block; font-size: 30px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; margin: 8px 12px; background: var(--page); }
.seg button { border: 0; padding: 8px; font: inherit; font-size: 12px; background: none; cursor: pointer; }
.seg button.on { background: var(--white); border-radius: 999px; font-weight: 700; }
.sw { width: 44px; height: 26px; border-radius: 999px; background: var(--primary); position: relative; border: 0; cursor: pointer; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--white); }
.sw.offsw { background: #D6D6D6; }
.sw.offsw::after { right: auto; left: 3px; }
.sw-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; font-size: 13.5px; }
.radio { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; font-weight: 700; padding: 8px 0; background: none; border: 0; font-family: inherit; text-align: left; cursor: pointer; width: 100%; color: var(--ink); }
.radio i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #555; flex: none; margin-top: 1px; }

  { id: 'c-profile', app: 'c', sec: 'Signed-in tabs', code: 'Profile', inv: 1, name: 'Profile', render: () => `${gHead('Profile')}<div class="body"><div class="pad" style="border-bottom:1px solid var(--line)"><b style="font-size:17px">Renato Probst</b><div style="color:#666;font-size:13px">renato@example.com</div></div>${['Addresses', 'Payment methods', 'Notifications', 'Help'].map(t => `<button type="button" class="list-row"><span class="grow">${t}</span><span class="chev">${ic('right')}</span></button>`).join('')}<button type="button" class="list-row" data-act="reset"><span class="grow">Reset demo</span><span class="chev">${ic('right')}</span></button></div>${tabs('c-profile')}` },

  /* customer: funnel */
  { id: 'c-select', app: 'c', sec: 'Quote funnel', code: 'C01–C03', name: 'Service select', render: () => `${cHead()}<div class="body pad"><h1 class="title">Get started with Mowly!</h1><p class="sub">What are you looking for?</p><div class="tiles">${Object.keys(SVC).map(n => `<button type="button" class="tile ${S.svc === n ? 'sel' : ''}" data-svc="${n}">${n}${S.svc === n ? `<span class="ck">${ic('checkc')}</span>` : ''}</button>`).join('')}</div></div><div class="foot">${btn('Continue', 'data-go="c-quote"' + (S.svc ? '' : ' disabled'))}</div>` },
  { id: 'c-quote', app: 'c', sec: 'Quote funnel', code: 'C04–C06', name: 'Quote form', render: () => `${cHead()}<div class="body pad"><h1 class="title">Let's get your ${svcName()} quote</h1><p class="sub">We need some details to provide a price estimate.</p>
      ${field('Name*', 'Renato')}${field('Address*', '1820 Maple Ridge Drive, Austin, TX', '', 'id="addr" style="border-color:var(--primary)"')}
      <div class="card" style="margin-top:2px;font-size:13px"><div style="padding:9px 12px;border-bottom:1px solid var(--line)">1820 Maple Ridge Drive<div style="font-size:10.5px;color:#999">Austin, TX 78704, USA</div></div><div style="padding:9px 12px">1820 Maple Ridge Cove<div style="font-size:10.5px;color:#999">Austin, TX 78704, USA</div></div></div>
      <div style="margin-top:8px">${field('', '', 'Apartment/Suite Number')}</div>${field('Phone Number*', '5125550147')}
      <p class="fine">By submitting my contact information, I agree that Mowly or its representatives may contact me by email, phone, or SMS at the email address or phone number I provide, including for marketing purposes and by automatic dialing systems. Message frequency varies. Text HELP for help. Text STOP to unsubscribe. I also agree to Mowly's <button type="button" class="link">terms of service</button> and <button type="button" class="link">privacy policy</button>.</p>
      <div class="center" style="gap:6px;font-size:13px">${ic('lock', 16)} Your information is safe &amp; secure</div></div><div class="foot">${btn('Continue', 'data-go="c-sizing"')}</div>` },
  { id: 'c-sizing', app: 'c', sec: 'Quote funnel', code: 'C07', name: 'Lawn sizing', render: () => `${sb()}<div class="body center" style="flex-direction:column;gap:22px;padding:0 24px;text-align:center"><div class="aerial"><svg class="ring" viewBox="0 0 218 218"><circle cx="109" cy="109" r="104"/></svg></div><h2 style="margin:10px 0 0;font-size:22px;line-height:1.25">We're sizing your lawn<br>with satellite precision!</h2><p style="margin:0;font-size:14px">Join <span style="color:var(--primary)">49 neighbors</span> in 78704 who've booked Mowly</p></div>` , enter: () => setTimeout(() => cur() === 'c-sizing' && go('c-plan', true), 2700) },
  { id: 'c-plan', app: 'c', sec: 'Quote funnel', code: 'C08–C10, C12', name: 'Pick your plan', render: () => { const opts = SVC[svcName()][1]; if (!S.plan || !opts.find(o => o[0] === S.plan[0])) S.plan = opts[0]; if (!S.planReady) return `${cHead()}<div class="body center"><div class="spinner"></div></div>`;
      return `${cHead()}<div class="body pad"><h1 class="title">Pick your ${svcName()} plan</h1><p class="sub">Select the frequency for your following services, you can always change this later.</p>
      <div style="display:grid;gap:8px">${opts.map((o, i) => `<div>${i === 0 ? '<span class="rec">Recommended</span>' : ''}<button type="button" class="plan ${S.plan[0] === o[0] ? 'sel' : ''}" data-plan="${i}" style="${i === 0 ? 'border-top-left-radius:0' : ''}"><span class="n">${o[0]}</span><span class="p"><b>$${o[1]}</b><small>per service</small></span></button></div>`).join('')}</div>
      <div class="lbl" style="margin-top:18px;font-weight:500;font-size:13px">Preferred start date</div><button type="button" class="inp" style="text-align:left;cursor:pointer" data-ov="c-date">${fmtY(S.start || addDays(2))}</button>
      <div class="center"><button type="button" class="glink" data-ov="c-promo" style="margin-top:8px">${S.promo ? 'Code applied: $5 off' : 'Add a promo code'}</button></div>
      <div class="callout"><div class="h">${ic('bulb', 18)} What's included?</div><ul><li>${SVC[svcName()][0]}</li></ul></div>
      <p style="text-align:center;font-size:14px">Have additional questions?<br>Read our <button type="button" class="link" data-ov="c-faq">Frequently Asked Questions</button></p>
      <p style="text-align:center"><button type="button" class="link" data-go="c-select">I'm not looking for ${svcName()}</button></p></div>
      ${foot(S.booking ? '<span class="spinner"></span> Continue' : 'Continue', S.booking ? 'disabled' : 'data-act="plan-continue"')}`; },
    enter: () => { S.planReady = false; setTimeout(() => { S.planReady = true; if (cur() === 'c-plan') render(); }, 800); } },
  { id: 'c-account', app: 'c', sec: 'Quote funnel', code: 'C13–C15', name: 'Create account + card', render: () => `${cHead()}<div class="body pad"><div style="display:flex;gap:12px;align-items:center"><button type="button" data-back class="photo-btn" style="width:30px;height:30px;background:#EEE;color:#333" aria-label="Back">${ic('arrowl', 16)}</button><h1 class="title" style="margin:0;font-size:22px">Create your account</h1></div>
      <div class="lbl">Full Name*</div><div class="row2"><input class="inp" value="Renato" aria-label="First name"><input class="inp" placeholder="Last Name" aria-label="Last name"></div>${field('Email address*', '', 'Email address')}
      <div class="card" style="margin-top:16px;padding:12px"><div style="display:flex;gap:8px;color:var(--primary);font-weight:700">${ic('card', 18)} Inspect First, Pay Later Promise</div><p style="font-size:13px;margin:8px 0 0;line-height:1.5">Your card won't be charged for 3 full days after service, giving you time to inspect the work and ensure you're 100% satisfied.</p></div>
      <div class="card" style="margin-top:12px;padding:12px"><div style="display:flex;gap:8px;color:var(--primary);font-weight:600;font-size:13px">${ic('card', 16)} Card</div>${field('Card number', '4242 4242 4242 4242')}<div class="row2"><div>${field('Expiration date', '12 / 34')}</div><div>${field('Security code', '123')}</div></div><p style="font-size:11.5px;color:var(--orange);font-weight:700;margin:8px 0 0">Demo card, nothing is charged.</p></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:11.5px;margin:16px 0"><input type="checkbox" id="tos" ${S.tos ? 'checked' : ''} data-act="tos"> By checking you agree to our <button type="button" class="link">Terms of Service</button></label>
      <div class="card" style="padding:12px;font-size:12px;line-height:1.5"><div>${ic('pin', 16)}</div><ul style="padding-left:18px"><li>Tell us within 5 days if anything's off and we'll re-mow or refund.</li><li>Get free pro switches and quotes for additional services at any time.</li></ul><b>Our terms include:</b><ul style="padding-left:18px"><li>All new lawn plans need to commit to a <b>3-cut minimum</b>.</li><li>If grass exceeds <b>9 inches</b>, a <b>one-time long-grass fee (up to 100% of your price)</b> may apply.</li><li>Cancel or reschedule at least <b>48 hrs in advance</b> to avoid fees.</li></ul></div>
      <p style="text-align:center;font-size:14px">Have additional questions?<br>Read our <button type="button" class="link" data-ov="c-faq">Frequently Asked Questions</button></p></div>
      ${foot(S.booking ? '<span class="spinner"></span> Book now' : 'Book now', S.booking ? 'disabled' : 'data-act="book"', !S.tos)}` },
  { id: 'c-booked', app: 'c', sec: 'Quote funnel', code: 'Booked', inv: 1, name: 'Booking confirmation', render: () => `${sb()}<div class="body center" style="flex-direction:column;gap:12px;padding:24px;text-align:center"><div class="illus" style="border-radius:50%;width:110px;height:110px">${ic('check')}</div><h1 class="title">You're booked!</h1><p class="sub">${svcName()}, ${S.plan ? S.plan[0] : ''}. First service on ${fmt(S.start || addDays(2))}. We'll match you with a pro and message you in the Inbox.</p></div><div class="foot">${btn('Go to my services', 'data-act="to-services"')}</div>` },

  /* customer overlays */
  { id: 'c-promo', app: 'c', sec: 'Modals', ov: 'full', base: 'c-plan', code: 'C11', name: 'Add promo code', render: () => `${sb()}<div class="pad" style="flex:1;display:flex;flex-direction:column"><div style="text-align:right"><button type="button" data-close class="link" style="color:var(--ink);text-decoration:none" aria-label="Close">${ic('x', 22)}</button></div><h1 class="title">Add Promo Code</h1><input class="inp" id="promo-in" placeholder="Code" aria-label="Promo code"><div style="margin-top:auto;padding-bottom:20px">${btn('Apply', 'data-act="promo"')}</div></div>` },
  { id: 'c-faq', app: 'c', sec: 'Modals', ov: 'full', base: 'c-plan', code: 'C16–C17', name: 'Policy FAQ', render: () => `${sb()}<div class="pad" style="flex:1;overflow:auto"><h1 class="title" style="font-weight:500">Frequent Questions about our Policies</h1>${[['What about long grass?', 'If your grass exceeds 9 inches, a one-time long-grass fee may apply, up to 100% of your regular mowing price. This covers the extra time and effort needed for overgrown lawns.'], ['Why a 3-cut minimum?', 'All new lawn plans require a 3-cut minimum commitment. We don\'t require annual contracts, just give us three cuts to show you what we can do for your lawn.'], ['What if I need to cancel?', 'Cancel or reschedule at least 48 hours in advance and you won\'t be charged. Less than 48 hours\' notice may result in a charge for the scheduled service.'], ['When will I be charged?', 'Three full days after each service, so you have time to inspect the work.'], ['How do I pay?', 'With the card on file. You can change it any time in Profile.'], ['Will I be charged taxes?', 'Sales tax applies where your state requires it.'], ['How can I get more information?', 'Message us from the Inbox and a person will answer.']].map(([q, a], i) => `<div class="acc"><button type="button" data-acc="${i}">${q}${ic(S.acc === i ? 'up' : 'down', 16)}</button>${S.acc === i ? `<p>${a}</p>` : ''}</div>`).join('')}</div><div class="foot">${btn('OK', 'data-close')}</div>` },
  { id: 'c-date', app: 'c', sec: 'Modals', ov: 'sheet', base: 'c-plan', code: 'Date sheet', inv: 1, name: 'Start date picker', render: () => `<div class="sheet"><h3>Preferred start date</h3>${Array.from({ length: 10 }, (_, i) => addDays(i + 1)).map((d, i) => `<button type="button" class="list-row" data-date="${i + 1}" style="padding:12px 4px"><span class="grow">${fmtY(d)}</span></button>`).join('')}</div>` },
  { id: 'c-manage', app: 'c', sec: 'Modals', ov: 'sheet', base: 'c-detail', code: 'Manage', inv: 1, name: 'Skip / reschedule / frequency / pause / cancel', render: () => { const k = S.manage || 'skip'; const T = { skip: ['Skip your next service?', 'Your ' + fmt(addDays(5)) + ' service will be skipped. The plan continues after it.', 'Skip service'], resched: ['Pick a new date', 'Choose a day in the next two weeks.', 'Reschedule'], freq: ['Change frequency', 'Weekly $57, Every 2 Weeks $60, Monthly $60.', 'Save'], pause: ['Pause for the season', 'We will stop until March and message you before restarting.', 'Pause'], cancel: ['Cancel this service?', 'You can book again any time from Browse.', 'Cancel service'] }[k]; return `<div class="sheet"><h3>${T[0]}</h3><p class="sub">${T[1]}</p><div style="display:grid;gap:8px">${btn(T[2], 'data-act="manage-ok"', k === 'cancel' ? 'orange' : '')}${btn('Keep as is', 'data-close', 'outline')}</div></div>`; } },

  /* pro: auth */
  { id: 'p-welcome', app: 'p', sec: 'Signed out', code: 'P01', name: 'Welcome', render: () => `${sb()}<div class="body pad" style="text-align:center;display:flex;flex-direction:column"><div style="margin-top:40px"><div class="wordmark" style="font-size:44px">Mowly</div><div style="color:var(--primary);font-size:17px;font-weight:600;margin-top:-4px">for lawn care professionals</div><div style="font-size:10px;margin-top:8px">Mowly Pro - v1.0.0</div></div><div class="illus" style="margin-top:30px">${ic('house')}</div><h2 style="font-size:17px;margin:24px 0 8px">Your Next Client is a Tap Away</h2><p style="font-size:13px;line-height:1.5;margin:0 12px">Get instant offers for jobs that match your expertise. Claim them immediately and start earning.</p><div class="dots3"><i class="on"></i><i></i><i></i></div><div style="margin-top:auto;display:grid;gap:10px">${btn('Log in', 'data-go="p-signin"')}${btn('Sign up', 'data-go="p-signup"', 'outline')}</div></div>` },
  { id: 'p-signin', app: 'p', sec: 'Signed out', code: 'P02', name: 'Sign in', render: () => `${pBar('Sign In')}<div class="body pad">${field('Email', '', 'e.g. mike@gmail.com')}${field('Password', '', 'Must have at least 6 characters')}<div class="center"><button type="button" class="glink" style="margin-top:14px">I need help accessing my account</button></div></div><div class="foot">${btn('Sign in', 'data-act="signin"')}</div>` },
  { id: 'p-signup', app: 'p', sec: 'Signed out', code: 'P03–P05', name: 'Sign up', render: () => `${pBar('Get Started')}<div class="body pad"><h1 class="title" style="font-size:21px">Sign up to become a top Mowly partner</h1>${field('Your zip code', '', 'e.g. 78701')}${field('Your email', '', 'e.g. mike@gmail.com')}${field('Your phone number', '', 'e.g. (555) 123-4567')}<div class="lbl">Select your category</div><button type="button" class="inp" style="text-align:left;cursor:pointer;display:flex;justify-content:space-between" data-ov="p-category">${S.cat || 'Select a category'} ${ic('down', 16)}</button>
      ${S.cat ? `<div class="callout"><div class="h">${ic('bulb', 18)} Core skills needed</div><ul>${(S.cat === 'Basic Lawn Care' ? ['Cleanup', 'Lawn Mowing', 'Leaf Removal', 'Weed Pulling', 'Weeding'] : ['Deep Pool Cleaning', 'Pool Cleaning', 'Pool Open & Close']).map(s => `<li>${s}</li>`).join('')}</ul></div>` : ''}
      <p class="fine">By submitting my contact information, I agree that Mowly or its representatives may contact me by email, phone, or SMS. Message and data rates may apply. Text HELP for help. Text STOP to unsubscribe.</p><p class="fine" style="margin-top:0">Consent is not a condition of service.</p></div><div class="foot">${btn('Next', 'data-act="signin"')}</div>` },
  { id: 'p-category', app: 'p', sec: 'Signed out', ov: 'sheet', base: 'p-signup', code: 'P04', name: 'Category picker', render: () => `<div class="sheet"><h3>Select a category</h3>${['Basic Lawn Care', 'Basic Pool Care'].map(c => `<button type="button" class="list-row" data-cat="${c}" style="padding:13px 4px"><span class="grow">${c}</span></button>`).join('')}</div>` },

  /* pro: dashboard + checklist */
  { id: 'p-dashboard', app: 'p', sec: 'Dashboard & checklist', code: 'P06', name: 'Dashboard checklist', render: () => { const nx = nextChecklist(); const row = (k, l) => { const done = S.check[k], open = k === nx; return `<button type="button" class="cl ${done ? 'done' : open ? '' : 'locked'}" ${done || open ? `data-go="p-${k}"` : 'disabled'}><span>${l}</span><span class="st">${done ? ic('check', 18) : ic('right', 18)}</span></button>`; };
      return `${pBar('', 'menu')}<div class="body pad"><div class="served">1291 customers served in Austin, TX</div><h1 class="title" style="font-size:21px;margin-top:16px">Welcome, Mike</h1>
      ${nx ? `<p style="font-size:13px;margin:0">Complete your account (Profile first, then payments):</p><div class="sec">Build a winning profile</div>${row('profile', 'Build a profile')}${row('skills', 'Add your skills')}${row('evaluate', 'Evaluate your skills')}${row('area', 'Add your work area')}<div class="sec">Set up to get paid</div>${row('gps', 'Turn on your GPS')}${row('damage', 'Accept damage fee')}${row('tax', 'Provide tax info')}${row('bank', 'Connect your bank account')}`
        : `<div class="card pad" style="margin:12px 0;display:flex;gap:10px;align-items:center;color:var(--primary);font-weight:700">${ic('checkc')} You're all set. <span style="color:#666;font-weight:500;font-size:12px">(invented)</span></div><div class="sec">Today's route</div><button type="button" class="jd" data-go="p-route">${ROUTE.map((r, i) => `<span>${i + 1}. ${r[0]}</span>`).join('')}<span class="glink" style="padding:0">View route</span></button><div class="sec">Available jobs near you</div>${S.jobs.filter(j => !S.claimed.includes(j.id)).slice(0, 3).map(j => `<button type="button" class="jd" data-go="p-jobs"><span class="top"><span>${j.svc}</span><span>$${j.price}</span></span><span>${j.a1}</span></button>`).join('')}`}
      <p style="font-size:11px;color:var(--mut);margin-top:18px">Demo: <button type="button" class="link" data-act="finish-check">${nx ? 'finish the checklist' : 'reset the checklist'}</button></p></div>`; } },
  { id: 'p-drawer', app: 'p', sec: 'Dashboard & checklist', ov: 'drawer', base: 'p-dashboard', code: 'P07', name: 'Drawer menu', render: () => `<div class="drawer"><div class="panel"><div class="who">MIKE SULLIVAN</div>${[['p-dashboard', 'gauge', 'Dashboard'], ['p-jobs', 'brief', 'Available Jobs'], ['p-skillsvc', 'tool', 'Skills and Services'], ['p-calendar', 'cal', 'Calendar'], ['p-crews', 'users', 'Crews'], ['p-pinbox', 'inbox', 'Inbox'], ['p-custsearch', 'search', 'Customer Search'], ['p-performance', 'award', 'Performance'], ['p-support', 'headset', 'Support'], ['p-settings', 'gear', 'Settings']].map(([id, i, l]) => `<button type="button" class="mi ${base() === id ? 'on' : ''}" data-root="${id}">${ic(i, 20)} ${l}${id === 'p-settings' ? '<span class="badge">1</span>' : ''}</button>`).join('')}</div><button type="button" class="scrim" data-close aria-label="Close menu"></button></div>` },
  { id: 'p-profile', app: 'p', sec: 'Dashboard & checklist', code: 'P08', name: 'Build profile: intro', render: () => `<div style="background:#BDBDBD">${sb()}</div><div class="body pad center" style="flex-direction:column;text-align:center;gap:10px"><div class="illus">${ic('mower')}</div><h2 style="font-size:16px;margin:12px 0 0">Build a winning profile</h2><p style="font-size:13px;line-height:1.5;margin:0">Your profile is free but it takes time to make it great. This is how you'll get matched with customers.</p></div><div class="foot">${btn('Continue', 'data-go="p-profile-form" data-replace')}</div>` },
  { id: 'p-profile-form', app: 'p', sec: 'Dashboard & checklist', code: 'P09', name: 'Build profile: form', render: () => `${pBar('Build a profile')}<div class="body pad"><h1 class="title" style="font-size:20px">Build a winning profile</h1><p style="font-size:13px;margin:0">Customers will see this information when you're assigned to the job.</p>${field('Business name', 'Sullivan Lawn Care')}${field('Year founded', '2019')}${field('Number of crew(s)', '', 'Number of crew(s)')}<div class="lbl">Upload a clear headshot photo</div><p style="font-size:11.5px;margin:0 0 10px">A profile photo can help build trust and rapport with your customers.</p><button type="button" class="photo-btn" aria-label="Pick a sample avatar">${ic('camera', 26)}</button></div><div class="foot">${btn('Continue', 'data-done="profile"')}</div>` },
  { id: 'p-skills', app: 'p', sec: 'Dashboard & checklist', code: 'Skills', inv: 1, name: 'Add your skills', render: () => `${pBar('Add your skills')}<div class="body pad"><div class="callout"><div class="h">${ic('bulb', 18)} Basic Lawn Care</div></div>${['Cleanup', 'Lawn Mowing', 'Leaf Removal', 'Weed Pulling', 'Weeding'].map(s => `<div class="sw-row">${s}<button type="button" class="sw" aria-label="${s}"></button></div>`).join('')}</div><div class="foot">${btn('Save', 'data-done="skills"')}</div>` },

const BY = Object.fromEntries(SCREENS.map(s => [s.id, s]));

/* ---------- navigation ---------- */
let stack = ['landing'], overlay = null, toastT;
const cur = () => stack[stack.length - 1];
const base = () => stack[0];
function go(id, replace) {
  const s = BY[id]; if (!s) return;
  if (s.ov) { if (stack.length === 1 && stack[0] === 'landing' || BY[cur()].app !== s.app) stack = [s.base]; overlay = id; render(); return; }
  overlay = null;
  if (replace) stack[stack.length - 1] = id; else stack.push(id);
  s.enter && s.enter(); render();
}
function root(id) { overlay = null; stack = [id]; BY[id].enter && BY[id].enter(); render(); }
function back() { if (overlay) { overlay = null; render(); return; } if (stack.length > 1) { stack.pop(); render(); } else if (cur() !== 'landing') root('landing'); }
function toast(msg) { clearTimeout(toastT); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#wrap').appendChild(t); toastT = setTimeout(() => t.remove(), 1800); }
const $ = s => document.querySelector(s);

function render() {
  const s = BY[cur()];
  const o = overlay && BY[overlay];
  $('#wrap').innerHTML = `<div class="screen ${s.gray ? 'gray' : ''}">${s.render()}</div>` +
    (o ? (o.ov === 'drawer' ? `<div class="overlay" style="background:none">${o.render()}</div>` : `<div class="overlay ${o.ov === 'full' ? 'full' : o.ov === 'alert' ? 'mid' : ''}" data-scrim>${o.render()}</div>`) : '');
  const shown = o || s;
  $('#now').innerHTML = `<b>${shown.code}</b> · ${shown.name}${shown.inv ? ' <span style="color:var(--orange);font-weight:700">(inventada)</span>' : ''} · ${shown.app === 'c' ? 'Mowly' : shown.app === 'p' ? 'Mowly Pro' : 'Web'}`;
  document.querySelectorAll('.ix').forEach(b => b.classList.toggle('on', b.dataset.ix === shown.id));
}

/* ---------- index ---------- */
function buildIndex() {
  const groups = [['web', 'Web'], ['c', 'Mowly (cliente)'], ['p', 'Mowly Pro (prestador)']];
  const html = `<h1>Mowly</h1><p class="lead">Protótipo clicável do PRD. Clique numa tela da lista ou navegue dentro do celular. Os códigos batem com os screenshots de referência.</p>
    <div class="legend"><span><b>C/P</b> = screenshot de referência</span><span><b class="inv" style="color:var(--orange)">*</b> = tela inventada no PRD</span></div>` +
    groups.map(([app, label]) => { const items = SCREENS.filter(s => s.app === app); const secs = [...new Set(items.map(s => s.sec))];
      return `<div class="group"><h2>${label} · ${items.length}</h2>${secs.map(sec => `<h3>${sec}</h3>${items.filter(s => s.sec === sec).map(s => `<button type="button" class="ix" data-ix="${s.id}"><code>${s.code}</code><span>${s.name}${s.inv ? ' <span class="inv">*</span>' : ''}</span></button>`).join('')}`).join('')}</div>`; }).join('');
  $('#index').innerHTML = html; $('#index-m').innerHTML = html;
}

/* ---------- interactions ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-go], [data-scrim]'); if (!t) return;
  const d = t.dataset;
  if (d.scrim !== undefined && e.target === t) { overlay = null; render(); return; }
  if (d.ix) { const s = BY[d.ix]; if (s.ov) { stack = [s.base]; overlay = s.id; render(); } else root(s.id); document.querySelector('.mobile-index')?.removeAttribute('open'); return; }
  if (t.id === 'b-back') return back();
  if (t.id === 'b-home') return root('landing');
  if (d.app) return root(d.app);
  if (d.tab) return root(d.tab);
  if (d.root) return root(d.root);
  if (d.close !== undefined) { overlay = null; render(); return; }
  if (d.back !== undefined) return back();
  if (d.svc) { S.svc = d.svc; render(); return; }
  if (d.quote) { S.svc = d.quote; S.plan = null; return go('c-select'); }
  if (d.price) { S.svc = d.price; S.plan = null; return go('c-quote'); }
  if (d.plan) { S.plan = SVC[svcName()][1][+d.plan]; render(); return; }
  if (d.date) { S.start = addDays(+d.date); overlay = null; render(); return; }
  if (d.acc) { S.acc = S.acc === +d.acc ? null : +d.acc; render(); return; }
  if (d.book) S.bookId = +d.book;
  if (d.manage) S.manage = d.manage;
  if (d.cat) { S.cat = d.cat; overlay = null; render(); return; }
  if (d.job) S.jobSel = +d.job;
  if (d.day) { S.jobDay = d.day === 'all' ? 'all' : +d.day; S.jobIdx = 0; render(); return; }
  if (d.pin) { S.jobIdx = +d.pin; render(); return; }
  if (d.pg) { const n = S.jobs.filter(j => !S.claimed.includes(j.id) && (S.jobDay === 'all' || j.day === S.jobDay)).length; S.jobIdx = (S.jobIdx + +d.pg + n) % n; render(); return; }
  if (d.rec) { S.rec = d.rec; render(); return; }
  if (d.sw) { S.notif[+d.sw] = !S.notif[+d.sw]; render(); return; }
  if (d.done) { S.check[d.done] = true; return root('p-dashboard'); }
  if (d.ov) { overlay = d.ov; render(); return; }
  if (d.go) return go(d.go, d.replace !== undefined);
  if (t.classList.contains('sw') && !d.sw) { t.classList.toggle('offsw'); return; }
  const a = d.act; if (!a) return;
  if (a === 'plan-continue') { S.booking = true; render(); setTimeout(() => { S.booking = false; if (cur() === 'c-plan') go('c-account'); }, 900); }
  if (a === 'promo') { if ($('#promo-in').value.trim()) { S.promo = true; overlay = null; render(); toast('Code applied: $5 off'); } }
  if (a === 'book') { S.booking = true; render(); setTimeout(() => { S.booking = false; S.bookings.unshift({ id: Date.now(), svc: svcName() === 'Mowing' ? 'Lawn Mowing' : svcName(), next: S.start || addDays(2), freq: S.plan[0], price: S.plan[1] - (S.promo ? 5 : 0), status: 'Scheduled' }); go('c-booked'); }, 1000); }
  if (a === 'to-services') { S.svc = null; S.plan = null; S.promo = false; S.tos = false; root('c-services'); }
  if (a === 'send') { const v = $('#chat-in').value.trim(); if (v) { S.msgs.push(['me', v]); render(); setTimeout(() => { S.msgs.push(['them', 'Thanks! Noted for the next visit.']); if (cur() === 'c-chat') render(); }, 2000); } }
  if (a === 'reset') { location.reload(); }
  if (a === 'manage-ok') { const b = S.bookings.find(x => x.id === S.bookId) || S.bookings[0]; if (S.manage === 'cancel') { S.bookings = S.bookings.filter(x => x !== b); overlay = null; root('c-services'); toast('Service canceled'); return; } if (S.manage === 'pause') b.status = 'Paused'; overlay = null; render(); toast('Saved'); }
  if (a === 'signin') root('p-dashboard');
  if (a === 'signout') root('p-welcome');
  if (a === 'link-bank') { S.linking = true; render(); setTimeout(() => { S.linking = false; S.bankLinked = true; if (cur() === 'p-bank') render(); }, 1000); }
  if (a === 'claim') { S.claimed.push(S.jobSel); S.jobIdx = 0; overlay = null; render(); toast('Job claimed. It is on your calendar.'); }
  if (a === 'rec-send') { S.rec = null; back(); toast('Recommendation sent'); }
  if (a === 'finish-check') { const all = !nextChecklist(); ORDER.forEach((k, i) => S.check[k] = all ? i < 2 : true); render(); }
  if (a === 'start1' || a === 'start2') { S.startOne = a === 'start1'; render(); }
  if (a === 'seg0' || a === 'seg1') { S.segAll = a === 'seg1'; render(); }
  if (a === 'toast') toast(d.msg);
});
document.addEventListener('change', e => { if (e.target.id === 'tos') { S.tos = e.target.checked; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[role="button"]')) e.target.click(); if (e.key === 'Escape' && overlay) { overlay = null; render(); } });

buildIndex(); render();
</script>
